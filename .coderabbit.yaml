# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CI owns lint, typecheck, tests and builds. This file covers what CI can't:
# policy on the PR itself, and conventions no linter enforces.
# Only settings that differ from the defaults are listed.

language: en-US

# slop_detection is an early access feature.
early_access: true

tone_instructions: >-
  Maintainer of a self-hosted OSS project reviewing outside contributions. Be
  direct and cite file and line. Skip praise and don't restate what the code
  obviously does.

reviews:
  profile: assertive

  # Required for `mode: error` to gate anything. Without it those checks are
  # just a red X. Also needs a branch protection rule on main requiring review.
  request_changes_workflow: true

  in_progress_fortune: false

  # These also drive a sparse checkout, so keep the list short.
  path_filters:
    - '!pnpm-lock.yaml'
    - '!RELEASE_NOTES_*.md'
    # Crowdin PRs touch every locale at once. CI checks key parity already.
    - '!packages/translations/src/locales/**'

  # Supplements the built-in review; doesn't replace it. Only rules that get
  # missed or that CI can't see.
  path_instructions:
    - path: '**/*'
      instructions: |
        Some things here are deliberate. Don't raise them unless the diff shows
        an actual bug:
        - Rules eslint.config.js turns off on purpose: no-unnecessary-condition,
          prefer-nullish-coalescing, restrict-template-expressions, array-type,
          dot-notation, no-confusing-void-expression, no-base-to-string,
          prefer-regexp-exec, no-inferrable-types, no-empty-object-type. They
          were judged too noisy for this codebase.
        - Calls into @deprecated APIs. That rule is a warn on purpose until the
          multi-server migration finishes.

    - path: '**/*.{ts,tsx}'
      instructions: |
        eslint sets no-non-null-assertion, no-explicit-any and the no-unsafe-*
        rules to warn, so these pass CI silently:
        - Flag `!` non-null assertions outside test files. noUncheckedIndexedAccess
          is on and narrowing is the intended fix.
        - Flag new `any` where a real type or `unknown` would work.
        Import order is node builtins, external, @tracearr/*, @/, then relative.
        Nothing enforces it.

    - path: 'apps/server/**/*.ts'
      instructions: |
        - Route input validates through Zod schemas from @tracearr/shared wired
          into the route definition. Flag hand-rolled validation in handlers.
        - Media server behavior belongs in the shared interface under
          services/mediaServer/. Flag branching on server type in calling code.
        - Tests use factories from @tracearr/test-utils (createTestSession,
          createTestUser, createMockRedis). Flag inline fixtures.
        - Stale and ROI stats must not double-count merged titles. Duplicate
          detection must not count mirrored files twice. Both have shipped as
          bugs before.

    - path: 'apps/server/src/db/schema.ts'
      instructions: |
        - A schema edit with no generated migration in the same PR is
          incomplete.
        - Hypertables, continuous aggregates, compression and retention
          policies belong in migrations. Drizzle doesn't model them.

    - path: 'apps/server/src/db/migrations/**'
      instructions: |
        Migrations are generated by drizzle-kit. Flag any diff that edits an
        existing migration instead of adding a new one. (Squawk covers unsafe
        DDL and locking on these files already.)

    - path: 'packages/shared/**/*.ts'
      instructions: |
        - WS_EVENTS is the only source of Socket.io event names, REDIS_KEYS of
          redis keys. Flag string literals on either side. A typo there fails
          silently at runtime, which typecheck can't catch.
        - Anything one app uses alone doesn't belong here.

    - path: 'apps/web/**/*.{ts,tsx}'
      instructions: |
        - Server reads go through a hook in hooks/queries/. Flag bare fetch in
          components.
        - Hook naming: useXxx for queries, useCreateXxx/useUpdateXxx/
          useDeleteXxx for mutations, useBulkXxx for bulk operations.
        - Live updates come from Socket.io events invalidating query keys. Flag
          new polling where an event handler belongs.
        - Use cn() for conditional classes, cva() for variants. Flag
          hand-concatenated class strings.

    - path: 'apps/mobile/**/*.{ts,tsx}'
      instructions: |
        - ThemeProvider imports from expo-router, never @react-navigation/native.
          expo-router vendors its own copy and the npm package sets a context it
          never reads. This caused a white toolbar flash on iOS 26 tab switches.
        - Styling is NativeWind, not StyleSheet. Not every Tailwind utility has
          a native equivalent.
        - The app is dark only. Flag light-mode branches and hardcoded light
          colors.

    - path: 'apps/mobile/{metro.config.js,babel.config.js}'
      instructions: |
        metro.config.js pins i18next, react-i18next and react to the app's own
        copies. pnpm gives workspace packages their own, and two instances mean
        raw i18n keys or invalid-hook-call crashes. Worklets bundle mode stays
        off. Changes here break at runtime, not typecheck, so ask for evidence
        the app was run.

  # Contributors can tick these checkboxes on their own PRs and have the bot
  # write the code. That defeats "you own what you submit".
  finishing_touches:
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  slop_detection:
    enabled: true
    label: 'possible-slop'

  auto_review:
    drafts: false
    # Renovate PRs are reviewed. Dependency policy is enforced below.
    ignore_usernames:
      - connorgallopo

  pre_merge_checks:
    title:
      mode: 'warning'
      requirements: >-
        Plain language describing what changed, like "Add session termination
        endpoint". Reject conventional commit prefixes (feat:, fix:, chore:,
        and scoped forms like feat(sessions):). Reject vague titles like "fix
        bug" or "update code".
    description:
      mode: 'warning'
    issue_assessment:
      mode: 'warning'
    docstrings:
      mode: 'off'

    custom_checks:
      - name: 'PR template intact'
        mode: 'error'
        instructions: |
          The PR body follows .github/pull_request_template.md.

          Fail if any of these headings are missing: Summary, Type of Change,
          Related Issue, Changes, Testing, AI Disclosure, Checklist.

          Fail if the body uses a different heading structure in place of the
          template. The usual replacement is an AI tool's default output
          format: headings like "What changed", "Root cause", "Test plan",
          "Motivation", "Implementation notes". Those are the default shape of
          Claude Code and Codex output and mean the template was never filled
          in.

          Fail if template HTML comment placeholders are still present with no
          answer, or if Summary or Changes contain only the template's bare
          bullet dashes.

          Pass if every heading is present and answered. Sections may be short.
          The Screenshots section may be deleted when the PR has no UI change.
          Related Issue may state there is no issue for a small bug fix.

          Unchecked checkboxes are an answer, not a failure. Only a missing or
          emptied section fails.

      - name: 'AI disclosure answered'
        mode: 'error'
        instructions: |
          CONTRIBUTING.md requires disclosure of significant AI usage.

          Fail if the AI Disclosure section was deleted from the PR body.
          Fail if the box is checked with no note saying how AI was used.
          Fail if the note gives no extent, like "used AI" or "AI assisted".
          The note says which parts, and whether AI wrote the implementation or
          assisted with it.

          Pass if the section exists and is answered either way: box unchecked,
          or box checked with a note naming the extent, such as "wrote the
          adapter myself, used Claude for the Zod schema".

          Do not judge whether AI was actually used, and do not judge whether
          the disclosed extent is acceptable. That call is the maintainer's.
          This checks only that the question was answered in enough detail to
          act on.

      - name: 'Feature PRs link a prior discussion'
        mode: 'error'
        instructions: |
          CONTRIBUTING.md requires features to be discussed with a code owner
          before code is written. Undiscussed feature PRs are closed regardless
          of code quality.

          Applies when the "New feature" box under Type of Change is ticked.

          Fail if no GitHub Discussion, issue, or Discord thread is linked under
          Related Issue.

          Pass when the box is not ticked. Pass for bug fixes, refactors, docs,
          tests and dependency updates.

          On failure, state that the feature needs discussion first, link
          CONTRIBUTING.md, and point to Discussions and Discord. Give the
          reason: an unrequested feature carries design decisions nobody agreed
          to.

      - name: 'Pinned dependency policy'
        mode: 'error'
        instructions: |
          Applies to package.json files, pnpm-workspace.yaml, docker/ and
          .github/workflows/. Renovate PRs included.

          Fail if typescript moves above 6.x in the root package.json or in any
          package except apps/mobile. typescript-eslint caps its typescript peer
          below 6.1 and the lint parser resolves the root copy. apps/mobile pins
          7.0.2 deliberately; that copy only feeds its own tsc --noEmit.

          Fail if a postgres or timescaledb image tag or digest changes anywhere,
          including compose files and CI service definitions. Those pins are
          deliberate and cover users who never move their database image.

          Fail if any version floor in the pnpm-workspace.yaml overrides block is
          lowered. Those are security pins.

          Pass if none of the above appear in the diff.

      - name: 'Tests accompany behavior changes'
        mode: 'warning'
        instructions: |
          Warn if the diff adds or changes behavior under apps/server/src or
          packages/shared with no test file changes in the same PR.
          Warn if a bug fix adds no regression test and the PR doesn't say why
          one isn't practical.

          Pass for docs, styling, config, dependency updates, and refactors
          covered by existing tests.

  tools:
    # CI owns lint and format. Running them here doubles every comment.
    eslint:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    # Prose linting on markdown is noise here.
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    # Drizzle generates the SQL; style linting it isn't useful. Squawk stays on
    # for lock-taking DDL.
    sqlfluff:
      enabled: false

chat:
  art: false

knowledge_base:
  linked_repositories:
    - repository: 'connorgallopo/tracearr-unraid-template'
      instructions: >-
        Unraid Community Applications template. It hardcodes env var names,
        ports and volume paths. Flag when a PR adds, renames or removes an env
        var in .env.example, changes an exposed port, or moves a data path,
        because the template breaks silently for Unraid users and nothing in
        CI catches it.
    - repository: 'connorgallopo/tracearr-docs'
      instructions: >-
        Documentation site. Flag when a PR changes API routes under
        apps/server/src/routes/, env vars in .env.example, or the setup steps
        under docker/, and the matching page here would go stale.
