
name: Fork branch test images

on:
  push:
    branches:
      - main
      - channels-dvr
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/write-erase/tracearr
  FORK_REPO: write-erase/Tracearr

concurrency:
  group: fork-branch-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.variant.name }} (${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
        variant:
          - name: standalone
            file: docker/Dockerfile
          - name: supervised
            file: docker/Dockerfile.supervised

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Fetch basemap
        uses: ./.github/actions/fetch-basemap

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: metadata
        shell: bash
        run: echo "build-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.file }}
          platforms: linux/${{ matrix.target.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION=${{ github.ref_name == 'main' && 'main' || 'channels-dvr' }}
            APP_TAG=${{ matrix.variant.name == 'supervised' && (github.ref_name == 'main' && 'supervised-latest' || 'supervised-dev') || (github.ref_name == 'main' && 'latest' || 'dev') }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILD_DATE=${{ steps.metadata.outputs.build-date }}
            APP_FORK_REPO=${{ env.FORK_REPO }}
            APP_IMAGE_REPO=${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.FORK_REPO }}
            org.opencontainers.image.url=https://github.com/${{ env.FORK_REPO }}
            org.opencontainers.image.vendor=write-erase
            org.opencontainers.image.version=${{ github.ref_name == 'main' && 'main' || 'channels-dvr' }}

      - name: Save image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\\n' "$DIGEST" > "$RUNNER_TEMP/digests/digest"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.target.arch }}
          path: ${{ runner.temp }}/digests/digest
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture test images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-architecture manifests
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          short_sha="${COMMIT_SHA:0:12}"

          for variant in standalone supervised; do
            amd64="$(cat "$RUNNER_TEMP/digests/digests-$variant-amd64/digest")"
            arm64="$(cat "$RUNNER_TEMP/digests/digests-$variant-arm64/digest")"

            [[ "$amd64" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]

            if [[ "$BRANCH_NAME" == "main" ]]; then
              if [[ "$variant" == "supervised" ]]; then
                tag="supervised-latest"
              else
                tag="latest"
              fi
            else
              if [[ "$variant" == "supervised" ]]; then
                tag="supervised-dev"
              else
                tag="dev"
              fi
            fi

            docker buildx imagetools create \\
              --tag "$IMAGE:$tag" \\
              --tag "$IMAGE:$tag-$short_sha" \\
              "$IMAGE@$amd64" \\
              "$IMAGE@$arm64"
          done

      - name: Verify published architectures
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" == "main" ]]; then
            tags="latest supervised-latest"
          else
            tags="dev supervised-dev"
          fi

          for tag in $tags; do
            echo "Checking $IMAGE:$tag"
            docker buildx imagetools inspect "$IMAGE:$tag" --raw |
              jq -e '
                [.manifests[].platform
                  | select(.os == "linux")
                  | .architecture]
                | sort | unique == ["amd64", "arm64"]'
          done
